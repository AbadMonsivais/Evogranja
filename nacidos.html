<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Partos</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            max-width: 600px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input[type="number"],
        input[type="text"],
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #218838;
        }
        canvas {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Registro de Partos</h1>
    <form id="partoForm">
        <label for="raza">Raza:</label>
        <select id="raza" name="raza" required>
            <option value="Cerdo">Cerdo</option>
            <option value="Borrego">Borrego</option>
            <option value="Vaca">Vaca</option>
            <option value="Chivo">Chivo</option>
        </select>

        <label for="nombreAnimal">Nombre del animal que parió:</label>
        <input type="text" id="nombreAnimal" name="nombreAnimal" required>

        <label for="totalCrias">Número total de crías:</label>
        <input type="number" id="totalCrias" name="totalCrias" min="0" required>

        <label for="criasBien">Número de crías que salieron bien:</label>
        <input type="number" id="criasBien" name="criasBien" min="0" required>

        <label for="criasDetalles">Número de crías con algún detalle o problema:</label>
        <input type="number" id="criasDetalles" name="criasDetalles" min="0" required>

        <label for="criasMuertas">Número de crías muertas:</label>
        <input type="number" id="criasMuertas" name="criasMuertas" min="0" required>

        <input type="submit" value="Registrar Parto">
    </form>

    <canvas id="myChart" width="400" height="200"></canvas>

    <script>
        const ctx = document.getElementById('myChart').getContext('2d');
        let myChart;

        document.getElementById('partoForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const nombreAnimal = document.getElementById('nombreAnimal').value;
            const totalCrias = parseInt(document.getElementById('totalCrias').value);
            const criasBien = parseInt(document.getElementById('criasBien').value);
            const criasDetalles = parseInt(document.getElementById('criasDetalles').value);
            const criasMuertas = parseInt(document.getElementById('criasMuertas').value);

            // Comprobamos que los números son correctos
            if (criasBien + criasDetalles + criasMuertas !== totalCrias) {
                alert('El total de crías debe coincidir con la suma de las crías bien, con problemas y muertas.');
                return;
            }

            // Mostramos la gráfica
            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Crías Bien', 'Con Problemas', 'Muertas'],
                    datasets: [{
                        label: Datos de ${nombreAnimal} (${document.getElementById('raza').value}),
                        data: [criasBien, criasDetalles, criasMuertas],
                        backgroundColor: [
                            'rgba(40, 167, 69, 0.5)', // Verde
                            'rgba(255, 193, 7, 0.5)', // Amarillo
                            'rgba(220, 53, 69, 0.5)'  // Rojo
                        ],
                        borderColor: [
                            'rgba(40, 167, 69, 1)',
                            'rgba(255, 193, 7, 1)',
                            'rgba(220, 53, 69, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            alert('Registro guardado');
            this.reset(); // Reinicia el formulario
        });
    </script>
</body>
</html>
