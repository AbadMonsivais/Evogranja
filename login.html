<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Evogranja</title>
    <link rel="icon" href="img/logoF-A.png" type="image/x-icon">
    <link rel="stylesheet" href="css/styleL.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Iniciar Sesión</h2>
            <form id="login-form" action="php/auth/login.php" method="POST">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
                
                <button type="submit">Iniciar Sesión</button>
            </form>
            <p>¿No tienes una cuenta? <a href="#" onclick="showRegister()">Regístrate</a></p>
        </div>
        
        <div class="register-box" style="display: none;">
            <h2>Registro</h2>
            <form id="register-form" action="php/auth/register.php" method="POST">
                <label for="reg-username">Usuario:</label>
                <input type="text" id="reg-username" name="username" required>
        
                <label for="reg-password">Contraseña:</label>
                <input type="password" id="reg-password" name="password" required>
        
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
        
                <!-- Nuevo campo para seleccionar el rol del usuario -->
                <label for="role">Selecciona tu rol:</label>
                <select id="role" name="role" required>
                    <option value="veterinario">Veterinario</option>
                    <option value="cuidador">Cuidador</option>
                    <option value="granjero">Granjero</option>
                </select>
        
                <button type="submit">Registrarse</button>
            </form>
            <p>¿Ya tienes una cuenta? <a href="#" onclick="showLogin()">Inicia Sesión</a></p>
        </div>
    </div>
    <script>
        function showRegister() {
            document.querySelector('.login-box').style.display = 'none';
            document.querySelector('.register-box').style.display = 'block';
        }

        function showLogin() {
            document.querySelector('.register-box').style.display = 'none';
            document.querySelector('.login-box').style.display = 'block';
        }
    </script>
</body>
</html>
